<svg xmlns="http://www.w3.org/2000/svg" width="844" height="390" viewBox="0 0 844 390">
  <style>text{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#30363D}.muted{fill:#68727C}.label{font-size:13px}.small{font-size:11px}.panel{fill:#FFF;stroke:#B8C0C8}.button{fill:#FFF;stroke:#9FA8B1}</style>
